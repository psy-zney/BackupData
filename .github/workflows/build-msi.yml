name: Build Zney MSI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout a clean source tree
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore application dependencies and Windows runtime pack
        run: dotnet restore BackupUtility.csproj -r win-x64

      - name: Restore test dependencies
        run: dotnet restore .\BackupUtility.Tests\BackupUtility.Tests.csproj

      - name: Run automated tests
        shell: pwsh
        run: |
          $testOutput = & dotnet test .\BackupUtility.Tests\BackupUtility.Tests.csproj -c Release --no-restore 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host $_ }
          if ($testExitCode -ne 0) {
            "### Automated test failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $testOutput | Select-Object -Last 100 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit $testExitCode
          }

      - name: Publish self-contained Windows application
        run: dotnet publish BackupUtility.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false --no-restore -o .\publish

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          wix build .\installer\Product.wxs -arch x64 -d PublishDir="$env:GITHUB_WORKSPACE\publish" -o .\artifacts\ZneyBackup.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZneyBackup-msi
          path: artifacts\ZneyBackup.msi
          if-no-files-found: error

      - name: Create GitHub release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" .\artifacts\ZneyBackup.msi --title "Zney Backup $env:GITHUB_REF_NAME" --generate-notes
